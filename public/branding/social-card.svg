<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">AssetTag Studio — spreadsheets in, labels out</title><desc id="desc">AssetTag Studio: a tag-shaped A with QR finder motifs. Decorative branding, not an encoded QR code.</desc><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}</style><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f7f9f8"/><stop offset="1" stop-color="#e7f3f0"/></linearGradient></defs><rect width="1200" height="630" fill="url(#wash)"/><path d="M0 0H1200V8H0Z" fill="#147d78"/><text x="80" y="80" font-size="18" font-weight="700" letter-spacing="3" fill="#147d78">QR + CODE 128</text><text x="1120" y="80" text-anchor="end" font-size="20" fill="#536a70">tagstudio.zachcodes.dev</text><rect x="76" y="149" width="288" height="288" rx="48" fill="#147d78"/><g transform="translate(92 165)" fill="#fff">
    <path fill-rule="evenodd" d="M111 20H156L230 94V123L188 224H145L158 187H96L82 224H37Z M106 114H150V158H106Z M164 74H192V102H164Z M112 58H122V68H112Z M132 78H142V88H132Z M162 126H172V136H162Z"/>
    <path d="M118 126H138V146H118Z M172 82H184V94H172Z"/>
  </g><text x="434" y="248" font-size="65" font-weight="750" letter-spacing="-3" fill="#20313b">AssetTag<tspan font-weight="450" fill="#536a70"> Studio</tspan></text><text x="438" y="316" font-size="38" font-weight="600" letter-spacing="-1" fill="#147d78">Spreadsheets in. Labels out.</text><text x="440" y="377" font-size="25" fill="#536a70">Create print-ready QR and barcode labels.</text><text x="440" y="417" font-size="25" fill="#536a70">Your inventory stays on your device.</text><path d="M80 505H1120" stroke="#ccddd7"/><text x="80" y="556" font-size="21" fill="#536a70">CSV + Excel</text><text x="600" y="556" text-anchor="middle" font-size="21" fill="#536a70">Actual-size PDF sheets</text><text x="1120" y="556" text-anchor="end" font-size="21" fill="#536a70">No login. No uploads.</text></svg>
